<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lost in the crates | DOGS Sampler</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0b0b0d;--ink:#f4f1e8;--mut:#b3aea0;--amber:#f2a71b;--mono:ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  min-height:100svh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
h1{font-weight:900;letter-spacing:-.04em;font-size:clamp(56px,16vw,140px);text-transform:uppercase}
h1 span{color:var(--amber)}
p{color:var(--mut);margin-top:12px}
a.btn{display:inline-block;margin-top:24px;background:var(--amber);color:#0b0b0d;font-weight:700;
  padding:13px 26px;border-radius:999px;text-decoration:none;font-family:var(--mono);font-size:13px}
.foot{margin-top:36px}.foot img{height:30px}
</style>
</head>
<body>
<main>
  <h1>OFF <span>BEAT</span></h1>
  <p>Nothing on this shelf. Back to the crates.</p>
  <a class="btn" href="/">Back to Sampler</a>
  <div class="foot"><a href="https://wearedogs.net"><img src="img/badge.png" alt="This product was made by DOGS" width="420" height="139"></a></div>
</main>
</body>
</html>
